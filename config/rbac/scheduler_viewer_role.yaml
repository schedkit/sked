# permissions for end users to view schedulers.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  labels:
    app.kubernetes.io/name: sked
    app.kubernetes.io/managed-by: kustomize
  name: scheduler-viewer-role
rules:
- apiGroups:
  - sked.schedkit.io
  resources:
  - schedulers
  verbs:
  - get
  - list
  - watch
- apiGroups:
  - sked.schedkit.io
  resources:
  - schedulers/status
  verbs:
  - get
