apiVersion: v1
kind: Service
metadata:
  name: {{ include "sked.fullname" . }}-webhook-service
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sked.labels" . | nindent 4 }}
spec:
  ports:
    - port: 443
      protocol: TCP
      targetPort: 9443
  selector:
    {{- include "sked.selectorLabels" . | nindent 4 }}
---
apiVersion: admissionregistration.k8s.io/v1
kind: ValidatingWebhookConfiguration
metadata:
  name: {{ include "sked.fullname" . }}-webhook
  labels:
    {{- include "sked.labels" . | nindent 4 }}
  {{- if .Values.webhook.certManager.enabled }}
  annotations:
    cert-manager.io/inject-ca-from: {{ .Release.Namespace }}/{{ include "sked.fullname" . }}-serving-cert
  {{- end }}
webhooks:
  {{- range $webhook := (.Files.Get "files/webhooks.yaml" | fromYaml).webhooks }}
  {{- $service := mergeOverwrite $webhook.clientConfig.service (dict "name" (printf "%s-webhook-service" (include "sked.fullname" $)) "namespace" $.Release.Namespace) }}
  {{- $_ := set $webhook.clientConfig "service" $service }}
  {{- if not $.Values.webhook.certManager.enabled }}
  {{- $_ := set $webhook.clientConfig "caBundle" (required "webhook.caBundle is required when webhook.certManager.enabled=false" $.Values.webhook.caBundle) }}
  {{- end }}
  - {{ toYaml $webhook | nindent 4 | trim }}
  {{- end }}
