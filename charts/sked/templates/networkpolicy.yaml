{{- if .Values.networkPolicy.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: {{ include "sked.fullname" . }}-ingress
  namespace: {{ .Release.Namespace }}
  labels:
    {{- include "sked.labels" . | nindent 4 }}
spec:
  podSelector:
    matchLabels:
      {{- include "sked.selectorLabels" . | nindent 6 }}
  policyTypes:
    - Ingress
  ingress:
    - ports:
        - port: 9443
          protocol: TCP
    {{- if .Values.metrics.enabled }}
    - from:
        - namespaceSelector:
            {{- toYaml .Values.networkPolicy.metricsNamespaceSelector | nindent 12 }}
      ports:
        - port: {{ .Values.metrics.port }}
          protocol: TCP
    {{- end }}
{{- end }}
